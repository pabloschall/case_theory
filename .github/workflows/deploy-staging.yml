name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Git commit SHA to deploy; defaults to the selected branch SHA
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate, and deploy
    runs-on: ubuntu-latest
    environment: staging
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      API_SERVICE: ${{ vars.GCP_API_SERVICE }}
      FRONTEND_SERVICE: ${{ vars.GCP_FRONTEND_SERVICE }}
      WORKER_POOL: ${{ vars.GCP_WORKER_POOL }}
      MIGRATION_JOB: ${{ vars.GCP_MIGRATION_JOB }}
      STAGING_FRONTEND_ORIGIN: ${{ vars.STAGING_FRONTEND_ORIGIN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Validate deployment configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          required=(
            PROJECT_ID REGION ARTIFACT_REPOSITORY API_SERVICE FRONTEND_SERVICE
            WORKER_POOL MIGRATION_JOB
            WORKLOAD_IDENTITY_PROVIDER DEPLOY_SERVICE_ACCOUNT
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub staging variable: ${name}" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve staging runtime configuration
        run: |
          required_secrets=(
            secret-key database-url openai-api-key mailgun-api-key
            mailgun-base-url mailgun-from-email fbi-api-key
          )
          for secret in "${required_secrets[@]}"; do
            version="$(gcloud secrets versions list "$secret" \
              --project="$PROJECT_ID" \
              --filter='state=ENABLED' \
              --limit=1 \
              --format='value(name)')"
            if [[ -z "$version" ]]; then
              echo "Google Secret Manager secret '$secret' has no enabled version." >&2
              exit 1
            fi
          done

          redis_host="$(gcloud redis instances describe case-theory-stg-redis \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(host)')"
          redis_port="$(gcloud redis instances describe case-theory-stg-redis \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(port)')"

          echo "REDIS_URL=redis://${redis_host}:${redis_port}/0" >> "$GITHUB_ENV"
          echo "API_RUNTIME_SERVICE_ACCOUNT=case-theory-stg-api@${PROJECT_ID}.iam.gserviceaccount.com" >> "$GITHUB_ENV"
          echo "FRONTEND_RUNTIME_SERVICE_ACCOUNT=case-theory-stg-frontend@${PROJECT_ID}.iam.gserviceaccount.com" >> "$GITHUB_ENV"
          echo "WORKER_RUNTIME_SERVICE_ACCOUNT=case-theory-stg-worker@${PROJECT_ID}.iam.gserviceaccount.com" >> "$GITHUB_ENV"
          echo "MIGRATION_RUNTIME_SERVICE_ACCOUNT=case-theory-stg-migration@${PROJECT_ID}.iam.gserviceaccount.com" >> "$GITHUB_ENV"
          echo "VPC_NETWORK=case-theory-stg-vpc" >> "$GITHUB_ENV"
          echo "VPC_SUBNET=case-theory-stg-${REGION}" >> "$GITHUB_ENV"
          echo "EVIDENCE_BUCKET=${PROJECT_ID}-staging-evidence" >> "$GITHUB_ENV"

      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Define immutable image names
        id: images
        run: |
          deploy_sha="$(git rev-parse HEAD)"
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}"
          echo "DEPLOY_SHA=${deploy_sha}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=${registry}/backend:${deploy_sha}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${registry}/frontend:${deploy_sha}" >> "$GITHUB_ENV"
          echo "backend=${registry}/backend:${deploy_sha}" >> "$GITHUB_OUTPUT"
          echo "frontend=${registry}/frontend:${deploy_sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.images.outputs.backend }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: production
          push: true
          tags: ${{ steps.images.outputs.frontend }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Write initial API configuration
        run: |
          cat > runtime.env.yaml <<EOF
          ENVIRONMENT: "staging"
          COOKIE_SECURE: "true"
          FRONTEND_URL: "https://staging.invalid"
          ALLOWED_HOSTS: '["*"]'
          REDIS_URL: "$REDIS_URL"
          STORAGE_PROVIDER: "gcs"
          GCS_BUCKET: "$EVIDENCE_BUCKET"
          GCS_PROJECT_ID: "$PROJECT_ID"
          GCS_SIGNING_SERVICE_ACCOUNT: "$API_RUNTIME_SERVICE_ACCOUNT"
          EOF

      - name: Deploy API revision
        run: |
          gcloud run deploy "$API_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$BACKEND_IMAGE" \
            --service-account="$API_RUNTIME_SERVICE_ACCOUNT" \
            --network="$VPC_NETWORK" \
            --subnet="$VPC_SUBNET" \
            --vpc-egress=private-ranges-only \
            --env-vars-file=runtime.env.yaml \
            --set-secrets=SECRET_KEY=secret-key:latest,DATABASE_URL=database-url:latest,OPENAI_API_KEY=openai-api-key:latest,MAILGUN_API_KEY=mailgun-api-key:latest,MAILGUN_BASE_URL=mailgun-base-url:latest,MAILGUN_FROM_EMAIL=mailgun-from-email:latest,FBI_API_KEY=fbi-api-key:latest \
            --allow-unauthenticated \
            --quiet

          api_url="$(gcloud run services describe "$API_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')"
          echo "API_URL=$api_url" >> "$GITHUB_ENV"

      - name: Deploy frontend revision
        run: |
          gcloud run deploy "$FRONTEND_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$FRONTEND_IMAGE" \
            --service-account="$FRONTEND_RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars="API_UPSTREAM=$API_URL,NGINX_ENVSUBST_FILTER=API_UPSTREAM" \
            --allow-unauthenticated \
            --quiet

          frontend_url="$(gcloud run services describe "$FRONTEND_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')"
          echo "FRONTEND_URL=${STAGING_FRONTEND_ORIGIN:-$frontend_url}" >> "$GITHUB_ENV"

      - name: Set public frontend origin on API
        run: |
          gcloud run services update "$API_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --update-env-vars="FRONTEND_URL=$FRONTEND_URL" \
            --quiet

      - name: Deploy and execute database migration job
        run: |
          sed "s#https://staging.invalid#$FRONTEND_URL#" runtime.env.yaml > runtime-final.env.yaml
          gcloud run jobs deploy "$MIGRATION_JOB" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$BACKEND_IMAGE" \
            --service-account="$MIGRATION_RUNTIME_SERVICE_ACCOUNT" \
            --network="$VPC_NETWORK" \
            --subnet="$VPC_SUBNET" \
            --vpc-egress=private-ranges-only \
            --env-vars-file=runtime-final.env.yaml \
            --set-secrets=SECRET_KEY=secret-key:latest,DATABASE_URL=database-url:latest,MAILGUN_API_KEY=mailgun-api-key:latest,MAILGUN_BASE_URL=mailgun-base-url:latest,MAILGUN_FROM_EMAIL=mailgun-from-email:latest \
            --command=./bin/migrate-and-seed \
            --max-retries=1 \
            --task-timeout=10m \
            --quiet
          gcloud run jobs execute "$MIGRATION_JOB" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --wait

      - name: Deploy worker revision
        run: |
          gcloud run worker-pools deploy "$WORKER_POOL" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$BACKEND_IMAGE" \
            --service-account="$WORKER_RUNTIME_SERVICE_ACCOUNT" \
            --network="$VPC_NETWORK" \
            --subnet="$VPC_SUBNET" \
            --vpc-egress=private-ranges-only \
            --env-vars-file=runtime-final.env.yaml \
            --set-secrets=SECRET_KEY=secret-key:latest,DATABASE_URL=database-url:latest,OPENAI_API_KEY=openai-api-key:latest,MAILGUN_API_KEY=mailgun-api-key:latest,MAILGUN_BASE_URL=mailgun-base-url:latest,MAILGUN_FROM_EMAIL=mailgun-from-email:latest,FBI_API_KEY=fbi-api-key:latest \
            --command=./bin/start-worker \
            --quiet

      - name: Smoke test staging
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
          "$API_URL/health"

      - name: Update scheduled case jobs
        run: |
          for lane in recent historical; do
            job="case-theory-stg-${lane}-draft"
            if gcloud run jobs describe "$job" --project="$PROJECT_ID" --region="$REGION" >/dev/null 2>&1; then
              gcloud run jobs update "$job" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --image="$BACKEND_IMAGE" \
                --quiet
            fi
          done

      - name: Record deployed images
        run: |
          echo "### Staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: \`$BACKEND_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: \`$FRONTEND_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
