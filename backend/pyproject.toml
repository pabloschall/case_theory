[project]
name = "eillen-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "google-cloud-storage>=3.3,<4",
  "httpx>=0.28,<1",
  "openai>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
